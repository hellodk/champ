name: Release

on:
  push:
    branches: [master]
  # An auto-merge enabled with GITHUB_TOKEN does not emit a master push event.
  # Publish from the closing release PR as well, so the version commit still
  # produces a release. workflow_dispatch allows recovering a missed publish.
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  # A feature merge plans the next version, but never publishes. The version
  # commit reaches master only through an auto-merge PR, so branch protection
  # (lint, type check, unit/integration/e2e, supply chain) gates the release.
  version:
    name: Plan next version
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    outputs:
      sha: ${{ steps.merge_wait.outputs.sha }}
      version: ${{ steps.merge_wait.outputs.version }}
    runs-on: ubuntu-latest
    env:
      # The version commit is automated; Husky's test hooks belong in CI.
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release metadata
        id: meta
        run: |
          set -euo pipefail
          current="$(scripts/champ version | sed 's/^champ //')"
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 || true)"
          # Conventional-commit subjects since the last release drive the bump:
          # feat -> minor, breaking -> major, everything else -> patch.
          if [[ -n "${latest_tag}" ]]; then
            commits="$(git log "${latest_tag}..HEAD" --pretty=format:%s)"
          else
            commits="$(git log --pretty=format:%s)"
          fi
          next="$(CHAMP_VERSION_COMMITS="${commits}" scripts/champ version next "$current" "$latest_tag")"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Skip if this release already exists
        id: skip
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and open auto-merge PR
        id: bump
        if: steps.skip.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.meta.outputs.next }}
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version "$NEXT" --no-git-tag-version
          git add package.json
          git commit -m "chore(release): ${NEXT}"
          # Re-runs regenerate this branch from a new master commit; stale tips
          # from a failed run must not block the version PR.
          git push --force origin "HEAD:refs/heads/release/${TAG}"

          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "release/${TAG}" --base master \
            --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base master \
              --head "release/${TAG}" --title "chore(release): ${NEXT}" \
              --body "Automated version bump for ${TAG}. Merges after required checks pass."
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --head "release/${TAG}" --base master \
              --json number --jq '.[0].number // empty')"
          fi
          test -n "$pr" || { echo "release PR not found"; exit 1; }
          gh pr merge --auto --squash "$pr"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      # Events from a merge performed with GITHUB_TOKEN are suppressed, so a
      # separate trigger cannot be relied on. Wait here and pass the merged
      # commit to the publish job in this same run.
      - name: Wait for version PR to merge
        id: merge_wait
        env:
          NEXT: ${{ steps.meta.outputs.next }}
          PR: ${{ steps.bump.outputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PR" || { echo "release PR not found"; exit 1; }
          merged_sha=""
          for _ in $(seq 1 90); do
            pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
            # The REST API reports state "closed" with merged=true; GraphQL's
            # "MERGED" value does not appear here.
            state="$(printf '%s' "$pr_data" | jq -r .state)"
            merged="$(printf '%s' "$pr_data" | jq -r .merged)"
            if [[ "$state" == "closed" && "$merged" == "true" ]]; then
              merged_sha="$(printf '%s' "$pr_data" | jq -r .merge_commit_sha)"
              break
            fi
            if [[ "$state" == "closed" ]]; then
              echo "release PR $PR closed without merging"
              exit 1
            fi
            sleep 20
          done
          test -n "$merged_sha" || { echo "timed out waiting for release PR $PR"; exit 1; }
          echo "sha=$merged_sha" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

  # Publishing runs from the version commit that auto-merged into master. A
  # merge performed with GITHUB_TOKEN does not emit a push event, so the closing
  # pull_request event is the primary trigger; push and manual dispatch are
  # fallbacks. Required checks have already passed on the release PR.
  publish:
    name: Build and publish release
    needs: version
    if: >-
      ${{
        always() && (
        needs.version.outputs.sha != '' ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')) ||
        (github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'chore(release):')) ||
        github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    env:
      # The version commit is automated; Husky's test hooks belong in CI.
      HUSKY: "0"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha || github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          version="$(scripts/champ version | sed 's/^champ //')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "vsix=champ-$version.vsix" >> "$GITHUB_OUTPUT"
          echo "tgz=champ-cli-$version.tgz" >> "$GITHUB_OUTPUT"

      # More than one trigger can fire for the same merge; only the first one
      # may create the tag and release.
      - name: Skip if this release is already published
        id: publish_skip
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build VSIX and CLI tarball
        if: steps.publish_skip.outputs.skip != 'true'
        run: |
          pnpm run compile
          pnpm exec vsce package --no-dependencies
          npm pack --ignore-scripts --pack-destination .

      - name: Verify CLI and extension versions
        if: steps.publish_skip.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mv "champ-${NEXT}.tgz" "champ-cli-${NEXT}.tgz"
          test "$(node dist/cli.js --version)" = "champ ${NEXT}"
          node -e "const p=require('./package.json'); if (p.version !== process.env.NEXT) { process.stderr.write('package.json version mismatch\n'); process.exit(1); }"

      - name: Tag and publish release
        if: steps.publish_skip.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
          TGZ: ${{ steps.version.outputs.tgz }}
          SHA: ${{ needs.version.outputs.sha || github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          gh release create "${TAG}" "$VSIX" "$TGZ" \
            --title "Champ v${TAG#v}" --target "$SHA" --generate-notes
